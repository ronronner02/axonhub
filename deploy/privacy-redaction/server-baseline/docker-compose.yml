services:
  postgres:
    image: postgres:16-alpine
    container_name: axonhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axonhub
      POSTGRES_USER: axonhub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    networks:
      - axonhub-network
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonhub -d axonhub"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    pids_limit: 256

  axonhub:
    image: looplj/axonhub:v1.0.0-beta7
    container_name: axonhub-app
    restart: unless-stopped
    environment:
      AXONHUB_SERVER_HOST: "0.0.0.0"
      AXONHUB_SERVER_PORT: "8090"
      AXONHUB_SERVER_NAME: "NeuraForge AxonHub"
      AXONHUB_SERVER_DEBUG: "false"
      AXONHUB_SERVER_API_AUTH_ALLOW_NO_AUTH: "false"
      AXONHUB_DB_DIALECT: "postgres"
      AXONHUB_DB_DSN: "postgres://axonhub:${DB_PASSWORD}@postgres:5432/axonhub?sslmode=disable"
      AXONHUB_DB_DEBUG: "false"
      AXONHUB_LOG_LEVEL: "warn"
      AXONHUB_LOG_DEBUG: "false"
      AXONHUB_METRICS_ENABLED: "false"
    networks:
      - axonhub-network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 4g
    pids_limit: 512

  gateway:
    image: nginx:1.28.0-alpine
    container_name: axonhub-gateway
    restart: unless-stopped
    user: "101:101"
    ports:
      - "127.0.0.1:8020:8080"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    networks:
      - axonhub-network
    depends_on:
      axonhub:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    pids_limit: 128

networks:
  axonhub-network:
    driver: bridge